name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Tests + couverture ; échoue sous les seuils (lignes 95 %, branches 85 %, fonctions 95 %)
      - name: Tests et couverture
        shell: bash
        run: npm run coverage --silent | tee coverage.txt
      - name: Résumé de la couverture
        if: always()
        shell: bash
        run: |
          {
            echo "### Couverture de tests"
            echo '```'
            sed -n '/start of coverage report/,/end of coverage report/p' coverage.txt | sed 's/^# //'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint de l'extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run version:check
      - name: ESLint (erreurs probables dans le code)
        run: npm run lint:js
      - name: Prettier (mise en forme)
        run: npm run format:check
      - name: web-ext lint (règles de Mozilla pour l'extension)
        run: npm run lint

  package:
    name: Paquet AMO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: stagetotrello-zip
          path: web-ext-artifacts/*.zip

  relay:
    name: Construction du relais
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx --no-install wrangler deploy --dry-run --outdir dist
        working-directory: relay

  dependency:
    name: Dépendances
    runs-on: ubuntu-latest
    env:
      # OSV-Scanner (Google) : base OSV, qui agrège GHSA et les paquets malveillants connus
      OSV_SCANNER_VERSION: 2.7.1
      # SHA-256 officielle de osv-scanner_linux_amd64 (osv-scanner_SHA256SUMS de la release)
      OSV_SCANNER_SHA256: fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm audit (bloque à partir de high)
        run: npm audit --audit-level=high
      - name: Signatures et provenance des paquets (registre npm)
        run: npm audit signatures
      # installation OSV-SCANNER
      - name: Installer OSV-Scanner (version figée, empreinte vérifiée)
        run: |
          file="osv-scanner_linux_amd64"
          curl -sSfLO "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/${file}"
          echo "${OSV_SCANNER_SHA256}  ${file}" | sha256sum -c -
          chmod +x "$file"
      - name: OSV-Scanner sur package-lock.json
        run: ./osv-scanner_linux_amd64 scan source --lockfile package-lock.json

  sast:
    name: SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Installer Semgrep (version figée)
        run: pip install semgrep==1.187.0
      - name: Tests des règles maison
        run: semgrep --test --config .semgrep/regles.yml .semgrep/regles.js
      # Règles publiques du registre Semgrep et règles maison (.semgrep/regles.yml).
      # --metrics=off : aucune télémétrie ; --error : échoue au moindre résultat
      - name: Semgrep (règles publiques et règles maison)
        run: >-
          semgrep scan --metrics=off --error
          --config p/default --config p/secrets --config .semgrep/regles.yml
          extension relay/src scripts

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    env:
      # Même version que le hook pre-commit (.pre-commit-config.yaml)
      GITLEAKS_VERSION: 8.30.1
      # SHA-256 officielle de gitleaks_8.30.1_linux_x64.tar.gz (checksums.txt de la release)
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tout l'historique, pas seulement le dernier commit
      - name: Installer gitleaks (version figée, empreinte vérifiée)
        run: |
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${file}"
          echo "${GITLEAKS_SHA256}  ${file}" | sha256sum -c -
          tar -xzf "$file" gitleaks
      - name: gitleaks sur tout l'historique
        run: ./gitleaks git --redact --verbose .

  source-main:
    name: Source de la PR vers main
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier que la PR vient de develop
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "develop" ]; then
            echo "::error::Seule develop peut être fusionnée dans main (reçu : $HEAD_REF)."
            exit 1
          fi
          echo "OK : la PR vient de develop."
