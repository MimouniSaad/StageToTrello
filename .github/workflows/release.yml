name: Release

# Une étiquette v<version> poussée sur un commit de main crée la GitHub Release,
# avec le paquet de l'extension et les notes tirées de CHANGELOG.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Release GitHub
    runs-on: ubuntu-latest
    permissions:
      contents: write   # nécessaire pour créer la release, et seulement dans ce job
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # tout l'historique, pour vérifier que l'étiquette est sur main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Vérifier l'étiquette (version et branche main)
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(node -p "require('./extension/manifest.json').version")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::L'étiquette $TAG ne correspond pas à la version du manifeste ($VERSION)."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::L'étiquette $TAG n'est pas sur un commit de main."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - run: npm run version:check
      - run: npm run package

      - name: Notes de version depuis CHANGELOG.md
        run: node scripts/release-notes.js "$VERSION" > release-notes.md

      - name: Créer la release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            "web-ext-artifacts/stagetotrello-$VERSION.zip" \
            --title "StageToTrello $VERSION" \
            --notes-file release-notes.md \
            --verify-tag
