# Mises à jour automatiques des dépendances, par PR vers develop.
# Référence : https://docs.github.com/fr/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2

updates:
  # Dépendances npm du dépôt (package.json à la racine : web-ext)
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Paris"
    cooldown:
      default-days: 3 # attendre 3 jours après la sortie d'une version
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      npm-mineures: # mineures + correctifs : une seule PR par semaine
        update-types:
          - "minor"
          - "patch"

  # Actions utilisées dans .github/workflows/
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions: # toutes les actions ensemble, majeures comprises
        patterns:
          - "*"
